<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:"
    />
    <title>Wind Map</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div id="app"></div>
    <div id="panel">
      <h1>Wind Map</h1>
      <div class="meta" id="data-source">データ読み込み中…</div>
      <div class="control">
        <div class="control-label">
          <span>粒子数</span>
        </div>
        <select id="count">
          <option value="128">16,384</option>
          <option value="256">65,536</option>
          <option value="512" selected>262,144</option>
          <option value="1024">1,048,576</option>
        </select>
      </div>
      <div class="control">
        <div class="control-label">
          <span>速度</span>
          <span class="value" id="speed-value">0.1</span>
        </div>
        <input id="speed" type="range" min="0.1" max="1" step="0.1" value="0.1" />
      </div>
      <div class="control">
        <div class="control-label">
          <span>明度</span>
          <span class="value" id="brightness-value">1.00</span>
        </div>
        <input id="brightness" type="range" min="0.1" max="2" step="0.05" value="1" />
      </div>
      <div class="control">
        <div class="control-label">
          <span>軌跡の長さ</span>
          <span class="value" id="trail-value">32</span>
        </div>
        <input id="trail" type="range" min="4" max="256" step="2" value="32" />
      </div>
      <div class="control">
        <label class="check-label">
          <input id="overlay" type="checkbox" />
          <span>風速カラーオーバーレイ</span>
        </label>
      </div>
      <div class="control" id="overlay-detail">
        <div class="control-label">
          <span>オーバーレイ濃度</span>
          <span class="value" id="overlay-opacity-value">0.30</span>
        </div>
        <input id="overlay-opacity" type="range" min="0.1" max="1" step="0.05" value="0.3" />
        <div id="speed-legend">
          <div class="bar"></div>
          <div class="labels"><span>0</span><span>35 m/s</span></div>
        </div>
      </div>
      <details id="appearance">
        <summary>表示設定</summary>
        <div class="control">
          <div class="control-label">
            <span>パーティクル配色</span>
          </div>
          <select id="scheme">
            <option value="standard" selected>標準</option>
            <option value="earth">アース</option>
            <option value="viridis">Viridis</option>
            <option value="turbo">Turbo</option>
          </select>
        </div>
        <div class="color-row">
          <span class="name">海岸線</span>
          <input id="col-coast-op" class="mini-op" type="range" min="0" max="1" step="0.05" value="0.5" />
          <input id="col-coast" type="color" value="#9db4d6" />
        </div>
        <div class="color-row">
          <span class="name">国境線</span>
          <input id="col-border-op" class="mini-op" type="range" min="0" max="1" step="0.05" value="0.3" />
          <input id="col-border" type="color" value="#8593a8" />
        </div>
        <div class="color-row">
          <span class="name">海</span>
          <input id="col-ocean" type="color" value="#0c1422" />
        </div>
        <div class="color-row">
          <span class="name">陸</span>
          <input id="col-land" type="color" value="#1d2939" />
        </div>
        <div class="color-row">
          <span class="name">経緯線</span>
          <input id="col-grat" type="color" value="#ffffff" />
        </div>
        <div class="color-row">
          <span class="name">大気光</span>
          <input id="col-halo" type="color" value="#4a7fc9" />
        </div>
        <div class="color-row">
          <span class="name">背景</span>
          <input id="col-bg" type="color" value="#0a0e14" />
        </div>
        <div class="color-row">
          <span class="name">星</span>
          <input id="col-stars" type="color" value="#5a6a82" />
        </div>
        <button id="colors-reset" type="button">既定に戻す</button>
      </details>
      <div class="control">
        <div class="control-label">
          <span>予報時刻</span>
          <span class="value" id="fcst-value">+0h</span>
        </div>
        <input id="fcst" type="range" min="0" max="120" step="3" value="0" />
      </div>
      <button id="fetch-btn">最新データを取得</button>
      <div class="control">
        <div class="control-label">
          <span>過去日時 (UTC)</span>
        </div>
        <input id="hist-time" type="datetime-local" min="2021-01-01T00:00" step="10800" />
      </div>
      <button id="hist-btn">過去データを取得</button>
      <div class="meta" id="fetch-status"></div>
      <div class="meta" id="fps"></div>
    </div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
